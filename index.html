
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Diwali 2026 - Ramji Sharma</title>

    <meta name="description"
          content="Celebrate Diwali 2026 with lights, happiness and prosperity. Best wishes from Ramji Sharma.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="fireworks"></canvas>

    <div class="stars"></div>

    <main class="container">

        <div class="top-label">
            ✨ Festival of Lights ✨
        </div>

        <div class="diya">
            <div class="flame"></div>
            <div class="diya-bowl"></div>
            <div class="diya-base"></div>
        </div>

        <h1>Happy Diwali</h1>

        <h2 class="year">2026</h2>

        <div class="divider">
            ✦ ❖ ✦ ❖ ✦
        </div>

        <p class="message">
            May this Diwali bring happiness,
            success, prosperity and endless
            blessings into your life.
        </p>

        <p class="wish">
            Wishing You and Your Family
            a Very Happy Diwali!
        </p>

        <div class="rangoli">
            🪷 🪔 🪷 🪔 🪷
        </div>

        <div class="signature">
            With Best Wishes
            <h3>Ramji Sharma</h3>
        </div>

        <button id="celebrateBtn">
            🎆 Celebrate Diwali
        </button>

        <button id="shareBtn" class="share-btn">
            Share on WhatsApp
        </button>

        <footer>
            © 2026 Ramji Sharma | Made with ❤️
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
